[package]
name = "valorpredict"
version = "0.1.0"
description = "Automatic Twitch Channel Points Predictions for your Valorant matches"
authors = ["AntiParty"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "valorpredict_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vap-core = { path = "../core" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros", "net", "io-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
