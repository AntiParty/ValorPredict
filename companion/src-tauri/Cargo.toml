[package]
name = "valorant-auto-predictions-companion"
version = "0.1.0"
description = "Safe local Valorant state companion"
authors = ["Valorant Auto Predictions"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "valorant_auto_predictions_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.37"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["time", "sync", "rt-multi-thread", "macros"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
