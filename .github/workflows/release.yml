name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs build the installer and upload it as a workflow artifact
  # (no release is created) — useful for testing the pipeline.
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            companion/src-tauri -> target
            companion/core -> target

      - name: Install UI dependencies
        working-directory: companion
        run: npm ci

      - name: Test vap_core
        working-directory: companion/core
        run: cargo test

      - name: Test companion shell
        working-directory: companion/src-tauri
        run: cargo test

      - name: Build installer and attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: companion
          tagName: ${{ github.ref_name }}
          releaseName: "ValorPredict ${{ github.ref_name }}"
          releaseDraft: true

      - name: Build installer (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: companion

      - name: Upload installer artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ValorPredict-installer
          path: companion/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
